    <h1>Cadastro Demonstrativo</h1>

    <form id="formCadastro">
        <label for="nome">Nome Completo:</label>
        <input type="text" id="nome" required>

        <label for="email">E-mail:</label>
        <input type="email" id="email" required>

        <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone" required placeholder="(00) 00000-0000">

        <button type="submit">Cadastrar</button>
    </form>

    <div id="mensagem"></div>

    <script>
        document.getElementById('formCadastro').addEventListener('submit', function(e) {
            e.preventDefault(); // Impede o envio real da página
            const nome = document.getElementById('nome').value;
            document.getElementById('mensagem').textContent = `Cadastro de ${nome} realizado com sucesso! (Demonstração)`;
            this.reset();
        });
    </script>

</body>

    <h1>Cadastro Demonstrativo</h1>
    <p class="nota-cadastro">Demonstração: o status do cadastro fica salvo apenas neste navegador; nenhum dado é enviado ao hospital.</p>

    <form id="formCadastro">
        <label for="nome">Nome Completo:</label>
        <input type="text" id="nome" required>

        <label for="email">E-mail:</label>
        <input type="email" id="email" required>

        <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone" required placeholder="(00) 00000-0000">

        <button type="submit">Cadastrar</button>
    </form>

    <div id="mensagem"></div>

    <script src="cadastro.js"></script>

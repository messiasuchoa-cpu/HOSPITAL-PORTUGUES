<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento - Hospital</title>
    <link rel="stylesheet" href="agendamento.css">
</head>
<body>

    <nav>
        <a href="index.html">Início</a>
        <a href="sobre.html">Sobre</a>
        <a href="especialidades.html">Especialidades</a>
        <a href="profissionais.html">Profissionais</a>
        <a href="cadastro.html">Cadastro</a>
        <a href="agendamento.html">Agendamento</a>
    </nav>

    <hr>

    <p id="aviso-acesso" class="aviso-acesso" role="alert" hidden></p>

    <h1>Simulação de Agendamento</h1>

    <form id="formAgendamento">
        <label for="especialidade">Especialidade:</label>
        <select id="especialidade" required>
            <option value="">Selecione...</option>
            <option value="Cardiologia">Cardiologia</option>
            <option value="Neurologia">Neurologia</option>
            <option value="Ginecologia e Obstetrícia">Ginecologia e Obstetrícia</option>
            <option value="Dermatologia">Dermatologia</option>
            <option value="Oftalmologia">Oftalmologia</option>
            <option value="Endocrinologia">Endocrinologia</option>
            <option value="Gastroenterologia">Gastroenterologia</option>
            <option value="Urologia">Urologia</option>
            <option value="Pediatria">Pediatria</option>
            <option value="Ortopedia">Ortopedia</option>
        </select>

        <label for="data">Data:</label>
        <input type="date" id="data" required>

        <label for="horario">Horário:</label>
        <input type="time" id="horario" required>

        <button type="submit">Simular Agendamento</button>
    </form>

    <div id="resumo" class="resumo">
        <h3>Resumo da Consulta</h3>
        <p><strong>Especialidade:</strong> <span id="resEspecialidade"></span></p>
        <p><strong>Data:</strong> <span id="resData"></span></p>
        <p><strong>Horário:</strong> <span id="resHorario"></span></p>
        <small><em>*Esta é apenas uma simulação demonstrativa.</em></small>
    </div>

    <script src="agendamento.js"></script>

</body>
</html>
